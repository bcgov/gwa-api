[tool.poetry]
name = "sdx-ca-token-api"
version = "1.0.0"
description = "API to generate one-time tokens for Step CA"
package-mode = false
authors = ["Your Name <your.email@gov.bc.ca>"]

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.135.0"
uvicorn = "^0.34.0"
pydantic = "^2.10.0"
python-json-logger = "^3.2.1"

[tool.poetry.group.dev.dependencies]
autopep8 = "^1.7.0"
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
httpx = "^0.28.0"

[tool.coverage.run]
relative_files = true
omit = [
    "tests"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
