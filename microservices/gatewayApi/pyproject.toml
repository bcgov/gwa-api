[tool.poetry]
name = "gwa-api"
version = "1.0.0"
package-mode = false
description = "Gateway API for multi-tenant configuration on Kong API Gateway"
authors = []

[tool.poetry.dependencies]
python = "^3.11"
werkzeug = "3.1.8"
cryptography = "50.0.0"
authlib = "1.7.2"
flask-swagger-ui = "5.32.13"
Jinja2 = "3.1.6"
PyYAML = "6.0.3"
flask = "3.1.3"
flask-compress = "1.24"
flask-cors = "6.0.5"
gevent = "26.8.0"
# greenlet = "2.0.2"
gunicorn = "26.1.0"
python-keycloak = "7.1.1"
requests = "^2.32"

[tool.poetry.dev-dependencies]
autopep8 = "^2.0.0"
pycodestyle = "2.14.0"
pylint = "4.0.7"
python-dotenv = "^1.0.0"
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.14.0"

[tool.poetry.group.dev.dependencies]
deptry = "^0.25.0"
pipdeptree = "^4.0.0"

[tool.coverage.run]
relative_files = true
omit = [
    "tests"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
