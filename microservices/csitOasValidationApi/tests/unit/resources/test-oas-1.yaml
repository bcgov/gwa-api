    get:
      operationId: getAllUsers
      tags:
        - "get"
      summary: List all users
      description: ""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: true

    post:
      operationId: createNewUser-bad
      tags:
        - "create"
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        201:
          description: Created
        default:
          description: Created

  /users/{id}:
    get:
      operationId: getUserById_bad
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found