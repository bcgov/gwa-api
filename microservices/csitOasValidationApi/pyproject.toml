[tool.poetry]
name = "csit-oas-validation-api"
version = "0.1.0"
description = "OpenAPI validation service using BCGov Spectral rulesets"
authors = ["phowells <paul.howells@gov.bc.ca>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
semver = "^3.0.4"

[tool.poetry.group.dev.dependencies]
httpx = "^0.27.0"
pytest = "^8.0"
respx = "^0.22.0"
pytest-asyncio = "^1.3.0"
coverage = "^7.13.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"